<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="bgGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#1536b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="#f7f3eb"/>
  <rect width="600" height="800" fill="url(#bgGrid)"/>

  <!-- stack of bound thesis papers, slightly fanned -->
  <g>
    <rect x="90" y="470" width="330" height="26" rx="2" fill="#e9e2d6" stroke="#15181d" stroke-width="2" transform="rotate(3 255 483)"/>
    <rect x="95" y="440" width="330" height="26" rx="2" fill="#fbf8f1" stroke="#15181d" stroke-width="2" transform="rotate(-2 260 453)"/>
    <rect x="100" y="410" width="330" height="26" rx="2" fill="#e9e2d6" stroke="#15181d" stroke-width="2" transform="rotate(1.5 265 423)"/>
    <rect x="90" y="378" width="330" height="30" rx="2" fill="#fbf8f1" stroke="#15181d" stroke-width="2.5"/>
    <!-- spine binding rings -->
    <circle cx="118" cy="393" r="5" fill="none" stroke="#1536b8" stroke-width="3"/>
    <circle cx="150" cy="393" r="5" fill="none" stroke="#1536b8" stroke-width="3"/>
    <circle cx="182" cy="393" r="5" fill="none" stroke="#1536b8" stroke-width="3"/>
    <!-- title block on top sheet -->
    <rect x="230" y="386" width="150" height="7" fill="#15181d" opacity="0.7"/>
    <rect x="230" y="399" width="90" height="5" fill="#5d6470" opacity="0.5"/>
  </g>

  <!-- rubber stamp, handle + red ink impression -->
  <g transform="translate(430 330) rotate(-8)">
    <rect x="-16" y="-70" width="32" height="55" rx="8" fill="#15181d"/>
    <rect x="-30" y="-18" width="60" height="24" rx="4" fill="#5d6470"/>
    <ellipse cx="0" cy="18" rx="46" ry="20" fill="#c83928" opacity="0.9"/>
    <ellipse cx="0" cy="18" rx="46" ry="20" fill="none" stroke="#c83928" stroke-width="2"/>
    <text x="0" y="24" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#fbf8f1" text-anchor="middle" letter-spacing="1">VERIFIED</text>
  </g>

  <!-- balance scale -->
  <g transform="translate(150 230)">
    <rect x="-3" y="0" width="6" height="90" fill="#15181d"/>
    <path d="M-70 20 L70 20" stroke="#15181d" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="16" r="8" fill="#1536b8"/>
    <!-- left pan -->
    <path d="M-70 20 L-70 46" stroke="#15181d" stroke-width="2.5"/>
    <path d="M-95 46 L-45 46" stroke="#15181d" stroke-width="2.5"/>
    <path d="M-95 46 C-95 62 -45 62 -45 46" fill="none" stroke="#15181d" stroke-width="2.5"/>
    <!-- right pan -->
    <path d="M70 20 L70 46" stroke="#15181d" stroke-width="2.5"/>
    <path d="M45 46 L95 46" stroke="#15181d" stroke-width="2.5"/>
    <path d="M45 46 C45 62 95 62 95 46" fill="none" stroke="#15181d" stroke-width="2.5"/>
    <!-- base -->
    <path d="M-30 90 L30 90 L20 112 L-20 112 Z" fill="#15181d"/>
  </g>

  <!-- feather quill -->
  <g transform="translate(465 560) rotate(24)">
    <path d="M0 0 C40 -8 62 -46 58 -100 C34 -84 16 -54 8 -22 C4 -10 2 -4 0 0 Z" fill="#fbf8f1" stroke="#15181d" stroke-width="2.5"/>
    <path d="M8 -6 C24 -34 40 -62 54 -92" stroke="#15181d" stroke-width="1.4" opacity="0.5"/>
    <path d="M0 0 L-10 26" stroke="#15181d" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- fountain pen -->
  <g transform="translate(120 610) rotate(-20)">
    <rect x="0" y="0" width="140" height="11" rx="5.5" fill="#15181d"/>
    <rect x="0" y="0" width="42" height="11" rx="5.5" fill="#1536b8"/>
    <path d="M140 5.5 L158 0 L158 11 Z" fill="#c8f348" stroke="#15181d" stroke-width="1"/>
  </g>

  <!-- ambient corner registration ticks -->
  <path d="M40 40 l24 0 M40 40 l0 24" stroke="#c83928" stroke-width="2.5"/>
  <path d="M560 760 l-24 0 M560 760 l0 -24" stroke="#c83928" stroke-width="2.5"/>
</svg>
